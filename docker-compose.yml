services:
  postgres:
    image: postgres:16-alpine
    container_name: student_visual_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-forobuap_dev}
    ports:
      - "${POSTGRES_DEV_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-forobuap_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_visual_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./app:/app/app:z
    environment:
      # La BD de desarrollo SIEMPRE es el servicio postgres local (nunca la BD remota).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-forobuap_dev}
      - DEV_MODE=${DEV_MODE:-true}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin-dev}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL:-community@forobuap.zrootsh.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-community@forobuap.zrootsh.com}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-Foro Comunidad BUAP 🐺}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key-buap-visual-carrer-local-dev-only}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5400,http://localhost:5173}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

volumes:
  postgres_dev_data:
